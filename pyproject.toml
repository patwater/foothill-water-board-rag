[project]
name = "wbrag"
version = "0.1.0"
description = "Citation-grounded RAG over LA-area water agency board records (stages 1-6: download pipeline)"
requires-python = ">=3.11"
dependencies = [
  "requests==2.32.5", "beautifulsoup4==4.15.0", "lxml==6.1.3", "tenacity==9.1.4",
  "pypdf==6.10.2", "filetype==1.2.0", "pyyaml==6.0.3",
]
[project.optional-dependencies]
dev = ["pytest==9.2.0"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
