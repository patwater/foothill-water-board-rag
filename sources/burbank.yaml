agency: burbank
legal_name: City of Burbank, Burbank Water and Power
run1_status: ok for Granicus-hosted BWP Board records (232 docs, 2012-04 to 2026-11)
probed: 2026-11-07
findings:
  - url: https://burbank.granicus.com/ViewPublisher.php?view_id=6
    result: HTTP 200, but robots.txt says `User-agent: *  Disallow: /` (only named search engines allowed)
  - url: https://www.burbankwaterandpower.com/bwp-board-meetings
    result: HTTP 200, robots allow. Says the BWP Board meets the first Thursday of each month at 5pm and that
            "full agenda packets and meeting minutes are available on the Burbank City website"
  - url: https://www.burbankca.gov/web/city-clerks-office/meeting-agendas-and-minutes
    result: HTTP 403, Cloudflare "Just a moment..." bot challenge (robots.txt itself allows crawling)
robots_override: >
  Patrick authorized overriding robots.txt for burbank.granicus.com on 2026-11-07 (config.py). Scoped to that
  host; the burbankca.gov Cloudflare challenge is not bypassed.
adapter: wbrag.adapters.burbank
coverage: >
  Granicus archive search (ViewSearchResults.php) lists every archived BWP Board meeting under two names,
  "Burbank Water and Power Board" (2011 on) and "BWP Board" (2019 on). 226 files ok, 6 duplicates, 0 failed;
  124 agendas and 109 minutes. 20 older PDFs have no text layer (needs OCR). Cancelled meetings are skipped.
  Meetings before 2012 or any not published to Granicus would need the City Clerk.
notes: >
  Burbank's current records are on burbankca.gov behind a Cloudflare challenge, and the Granicus archive is
  robots-disallowed. Neither was bypassed. The BWP Board is the utility's own body; Council attachments are
  out of scope except water/power items (spec section 1).
